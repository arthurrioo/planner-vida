name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment contract
        run: npm run validate:env:ci

      - name: Secret hygiene
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: App typecheck
        run: npm run typecheck

      - name: E2E typecheck
        run: npm run typecheck:e2e

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
